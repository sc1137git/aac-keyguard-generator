<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AAC Keyguard 產生器</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">AAC 工具</div>
        <h1>Keyguard 產生器</h1>
        <p>上傳 AAC 截圖、標示要挖空的區域，再輸出 SVG / STL。</p>
      </div>
      <div class="status" id="status">第一版</div>
    </header>

    <section class="workspace">
      <aside class="panel controls">
        <h2>1. 上傳與尺寸</h2>
        <label class="upload">
          <input id="imageInput" type="file" accept="image/*" />
          <span>選擇 AAC 截圖</span>
        </label>

        <label>iPad 型號
          <select id="presetSelect"></select>
        </label>

        <div class="size-card">
          <span>實體螢幕範圍</span>
          <strong id="screenSize">—</strong>
        </div>

        <h2>2. Keyguard 設定</h2>
        <label class="toggle-row">
          <input id="earsToggle" type="checkbox" />
          <span>加固定耳朵</span>
        </label>
        <div class="hint" id="thicknessHint">主體厚度：3 mm</div>

        <h2>3. 孔位工具</h2>
        <p class="small">在圖片上拖曳矩形，建立「要挖空」的範圍。點選既有框可刪除。</p>
        <div class="button-row">
          <button id="clearBtn" class="secondary">清空孔位</button>
          <button id="undoBtn" class="secondary">復原</button>
        </div>

        <h2>4. 匯出</h2>
        <div class="button-stack">
          <button id="svgBtn">下載 SVG</button>
          <button id="stlBtn">下載 STL</button>
        </div>
      </aside>

      <section class="canvas-panel">
        <div class="canvas-toolbar">
          <div>
            <strong>孔位編修</strong>
            <span id="holeCount">0 個孔</span>
          </div>
          <div class="legend"><span class="legend-hole"></span> 白色 = 挖空</div>
        </div>
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="editorCanvas"></canvas>
          <div class="empty-state" id="emptyState">先上傳一張完整 iPad 螢幕截圖</div>
        </div>
      </section>

      <aside class="panel preview-panel">
        <h2>黑白預覽</h2>
        <canvas id="previewCanvas"></canvas>
        <div class="preview-note" id="mirrorNote">無耳朵：不鏡像</div>
        <div class="spec-list">
          <div><span>主體厚度</span><strong id="bodyThickness">3 mm</strong></div>
          <div><span>耳朵厚度</span><strong id="earThickness">—</strong></div>
          <div><span>生成順序</span><strong id="flowText">正常生成</strong></div>
        </div>
      </aside>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
